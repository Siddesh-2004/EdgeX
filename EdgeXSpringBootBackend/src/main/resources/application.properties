server.port=8080

spring.application.name=edgex-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/edgex_db
spring.datasource.username=edgex_user
spring.datasource.password=edgex_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG

judge0.base-url=${JUDGE0_BASE_URL:http://localhost:2358}