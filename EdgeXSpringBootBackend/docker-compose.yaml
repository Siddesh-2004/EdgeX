version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: edgex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: edgex_db
      POSTGRES_USER: edgex_user
      POSTGRES_PASSWORD: edgex_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgex_user -d edgex_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: